<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Theme options</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style></style>
<style>
body{margin:0}
a{color:#4f6bed}a:hover{color:#3550d4}
</style>
</helmet>
<div style="width: 2640px; height: 1080px; box-sizing: border-box; padding: 48px; background: hsl(225,10%,93%); font-family: 'Segoe UI Variable Text', 'Segoe UI', Inter, system-ui, sans-serif; color: hsl(225,25%,12%)">
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px">
    <sc-for list="{{themes}}" as="t" hint-placeholder-count="8">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: baseline; gap: 10px">
          <div style="font-size: 22px; font-weight: 600">{{t.name}}</div>
          <div style="font-size: 13px; color: hsl(222,10%,40%)">{{t.mode}}</div>
        </div>
        <div style="font-size: 14px; line-height: 1.45; color: hsl(222,10%,34%); min-height: 40px">{{t.blurb}}</div>

        <!-- Mini app preview -->
        <div style="height: 340px; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font-size: 11.5px; box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.08)">
          <div style="height: 30px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: {{t.surface}}">
            <div style="width: 14px; height: 14px; border-radius: 4px; background: {{t.accent}}"></div>
            <div style="font-weight: 600">Tidemail</div>
            <div style="flex: 1"></div>
            <div style="width: 180px; height: 18px; border-radius: 5px; border: 1px solid {{t.border}}; background: {{t.raised}}"></div>
            <div style="flex: 1"></div>
          </div>
          <div style="flex: 1; min-height: 0; display: flex">
            <div style="width: 118px; flex: none; padding: 8px 6px; display: flex; flex-direction: column; gap: 2px; background: {{t.surface}}">
              <div style="height: 22px; margin-bottom: 6px; border-radius: 5px; background: {{t.accent}}; color: {{t.accentFg}}; display: flex; align-items: center; justify-content: center; font-weight: 500">Compose</div>
              <div style="height: 22px; padding: 0 8px; display: flex; align-items: center; gap: 6px; border-radius: 5px; background: {{t.raised}}; font-weight: 500"><span style="width: 8px; height: 8px; border-radius: 2px; border: 1.5px solid {{t.accent}}"></span>Inbox</div>
              <div style="height: 22px; padding: 0 8px; display: flex; align-items: center; gap: 6px; color: {{t.muted}}"><span style="width: 8px; height: 8px; border-radius: 2px; border: 1.5px solid {{t.muted}}"></span>Starred</div>
              <div style="height: 22px; padding: 0 8px; display: flex; align-items: center; gap: 6px; color: {{t.muted}}"><span style="width: 8px; height: 8px; border-radius: 2px; border: 1.5px solid {{t.muted}}"></span>Sent</div>
              <div style="height: 22px; padding: 0 8px; display: flex; align-items: center; gap: 6px; color: {{t.muted}}"><span style="width: 8px; height: 8px; border-radius: 2px; border: 1.5px solid {{t.muted}}"></span>Drafts</div>
            </div>
            <div style="width: 210px; flex: none; padding: 6px 5px; display: flex; flex-direction: column; gap: 2px; border-left: 1px solid {{t.border}}; border-right: 1px solid {{t.border}}">
              <div style="height: 40px; padding: 0 8px; display: flex; align-items: center; gap: 7px; border-radius: 5px">
                <span style="width: 5px; height: 5px; border-radius: 50%; background: {{t.accent}}"></span>
                <span style="width: 20px; height: 20px; border-radius: 50%; background: {{t.raised}}"></span>
                <div style="flex: 1; min-width: 0"><div style="font-weight: 600">GitHub</div><div style="color: {{t.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Run failed: CI - main</div></div>
              </div>
              <div style="height: 40px; padding: 0 8px; display: flex; align-items: center; gap: 7px; border-radius: 5px; background: {{t.selected}}">
                <span style="width: 5px; height: 5px; border-radius: 50%; background: {{t.accent}}"></span>
                <span style="width: 20px; height: 20px; border-radius: 50%; background: {{t.raised}}"></span>
                <div style="flex: 1; min-width: 0"><div style="font-weight: 600">Anna Weber</div><div style="color: {{t.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Re: Werkstudent interview</div></div>
                <span style="color: {{t.star}}">★</span>
              </div>
              <div style="height: 40px; padding: 0 8px; display: flex; align-items: center; gap: 7px; border-radius: 5px">
                <span style="width: 5px; height: 5px"></span>
                <span style="width: 20px; height: 20px; border-radius: 50%; background: {{t.raised}}"></span>
                <div style="flex: 1; min-width: 0"><div>Deutsche Bahn</div><div style="color: {{t.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Ihre Fahrkarte</div></div>
              </div>
              <div style="height: 40px; padding: 0 8px; display: flex; align-items: center; gap: 7px; border-radius: 5px">
                <span style="width: 5px; height: 5px"></span>
                <span style="width: 20px; height: 20px; border-radius: 50%; background: {{t.raised}}"></span>
                <div style="flex: 1; min-width: 0"><div>Max Hoffmann</div><div style="color: {{t.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Lunch tomorrow?</div></div>
              </div>
            </div>
            <div style="flex: 1; min-width: 0; padding: 12px; display: flex; flex-direction: column; gap: 8px">
              <div style="font-size: 13px; font-weight: 600; line-height: 1.3">Re: Werkstudent interview</div>
              <div style="padding: 8px; border-radius: 7px; border: 1px solid {{t.border}}; display: flex; flex-direction: column; gap: 5px">
                <div style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; height: 16px; border-radius: 50%; background: {{t.raised}}"></span><b>Anna Weber</b></div>
                <div style="height: 5px; border-radius: 3px; background: {{t.raised}}"></div>
                <div style="height: 5px; width: 70%; border-radius: 3px; background: {{t.raised}}"></div>
              </div>
              <div style="display: flex; gap: 6px">
                <div style="height: 20px; padding: 0 8px; border-radius: 5px; background: {{t.accent}}; color: {{t.accentFg}}; display: flex; align-items: center; font-weight: 500">Approve</div>
                <div style="height: 20px; padding: 0 8px; border-radius: 5px; border: 1px solid {{t.border}}; background: {{t.raised}}; display: flex; align-items: center">Reply</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Swatches -->
        <div style="display: flex; gap: 8px">
          <sc-for list="{{t.swatches}}" as="s" hint-placeholder-count="6">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
              <div style="height: 28px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.12); background: {{s.c}}"></div>
              <div style="font-size: 11px; color: hsl(222,10%,36%)">{{s.n}}</div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:2640,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  renderVals() {
    const T = (name, mode, blurb, p) => Object.assign({ name: name, mode: mode, blurb: blurb }, p, {
      swatches: [
        { n: 'Background', c: p.bg }, { n: 'Surface', c: p.surface }, { n: 'Raised', c: p.raised },
        { n: 'Selected', c: p.selected }, { n: 'Text', c: p.fg }, { n: 'Accent', c: p.accent }
      ]
    });
    return {
      themes: [
        T('Midnight', 'Dark · default', 'Cool slate with an indigo accent. The look from the “after” mockups.', {
          bg: 'hsl(225,12%,10%)', surface: 'hsl(225,13%,7.5%)', raised: 'hsl(225,10%,15%)', selected: 'hsl(228,38%,17.5%)',
          border: 'hsl(225,9%,16.5%)', fg: 'hsl(220,14%,92%)', muted: 'hsl(222,8%,60%)', accent: 'hsl(228,92%,69%)', accentFg: '#fff', star: 'hsl(42,95%,58%)' }),
        T('Graphite', 'Dark', 'Neutral warm grey with an amber accent. For people who find blue-tinted darks too cold.', {
          bg: 'hsl(30,4%,10%)', surface: 'hsl(30,4%,7.5%)', raised: 'hsl(30,4%,15.5%)', selected: 'hsl(36,32%,16%)',
          border: 'hsl(30,4%,17%)', fg: 'hsl(40,10%,91%)', muted: 'hsl(35,5%,61%)', accent: 'hsl(36,92%,60%)', accentFg: 'hsl(30,40%,10%)', star: 'hsl(48,95%,60%)' }),
        T('Fjord', 'Dark, softer', 'Lighter blue-grey with a frosty cyan accent. Lower contrast, easier for long evenings.', {
          bg: 'hsl(218,22%,15%)', surface: 'hsl(220,23%,12%)', raised: 'hsl(218,20%,20.5%)', selected: 'hsl(205,35%,23%)',
          border: 'hsl(218,18%,22%)', fg: 'hsl(215,25%,90%)', muted: 'hsl(215,14%,66%)', accent: 'hsl(193,60%,62%)', accentFg: 'hsl(218,30%,12%)', star: 'hsl(40,85%,66%)' }),
        T('Forest', 'Dark', 'Deep green-black with an emerald accent. Calm, and pairs well with GitHub’s green states.', {
          bg: 'hsl(160,14%,9%)', surface: 'hsl(160,16%,6.5%)', raised: 'hsl(160,12%,14.5%)', selected: 'hsl(155,35%,16%)',
          border: 'hsl(160,10%,16%)', fg: 'hsl(150,12%,91%)', muted: 'hsl(155,7%,61%)', accent: 'hsl(152,60%,52%)', accentFg: 'hsl(160,40%,8%)', star: 'hsl(45,90%,60%)' }),
        T('Rosé', 'Dark', 'Plum-tinted dark with a pink accent. The most playful of the set.', {
          bg: 'hsl(300,10%,10%)', surface: 'hsl(300,11%,7.5%)', raised: 'hsl(300,9%,15.5%)', selected: 'hsl(330,35%,18%)',
          border: 'hsl(300,8%,17%)', fg: 'hsl(320,15%,92%)', muted: 'hsl(310,7%,63%)', accent: 'hsl(336,85%,70%)', accentFg: 'hsl(336,50%,12%)', star: 'hsl(42,95%,62%)' }),
        T('Daylight', 'Light · default', 'Crisp white with the same indigo accent. The light twin of Midnight.', {
          bg: 'hsl(0,0%,100%)', surface: 'hsl(225,25%,97%)', raised: 'hsl(225,20%,92.5%)', selected: 'hsl(228,95%,95%)',
          border: 'hsl(225,14%,90%)', fg: 'hsl(225,25%,12%)', muted: 'hsl(222,10%,42%)', accent: 'hsl(228,78%,56%)', accentFg: '#fff', star: 'hsl(38,95%,46%)' }),
        T('Paper', 'Light, warm', 'Off-white with a deep teal accent. Less glare than pure white during the day.', {
          bg: 'hsl(40,30%,98%)', surface: 'hsl(40,22%,94%)', raised: 'hsl(40,16%,88%)', selected: 'hsl(178,40%,90%)',
          border: 'hsl(40,14%,86%)', fg: 'hsl(30,15%,14%)', muted: 'hsl(30,8%,38%)', accent: 'hsl(178,65%,30%)', accentFg: '#fff', star: 'hsl(36,95%,42%)' }),
        T('High contrast', 'Dark, accessible', 'Pure black, white text and a yellow accent with strong borders. For low vision or bright rooms.', {
          bg: 'hsl(0,0%,0%)', surface: 'hsl(0,0%,0%)', raised: 'hsl(0,0%,16%)', selected: 'hsl(55,100%,16%)',
          border: 'hsl(0,0%,55%)', fg: 'hsl(0,0%,100%)', muted: 'hsl(0,0%,82%)', accent: 'hsl(55,100%,55%)', accentFg: '#000', star: 'hsl(55,100%,55%)' })
      ]
    };
  }
}
</script>


</body></html>
