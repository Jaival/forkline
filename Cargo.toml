[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
fl-types = { path = "crates/fl-types" }
fl-db = { path = "crates/fl-db" }
fl-sync = { path = "crates/fl-sync" }
fl-git = { path = "crates/fl-git" }
fl-search = { path = "crates/fl-search" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }

# GPUI stack. gpui-kit pins the exact gpui-pre snapshot; bump only together (ADR 0001).
gpui-kit = "=0.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

# Fast dev builds for the fake generator and benches.
[profile.dev.package."*"]
opt-level = 2
