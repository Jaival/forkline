[package]
name = "fl-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "forkline"
path = "src/main.rs"

[dependencies]
fl-types.workspace = true
fl-db.workspace = true
fl-sync.workspace = true
fl-git.workspace = true
fl-search.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
# Syntax colours in diffs and code blocks: the grammars of common languages.
gpui-kit = { workspace = true, features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
async-channel = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[lints]
workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"
wiremock = "0.6.5"
