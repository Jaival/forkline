[package]
name = "fl-sync"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
fl-types.workspace = true
fl-db.workspace = true
keyring-core = "1.0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "form"] }
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rusqlite.workspace = true
fl-search.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
wiremock = "0.6.5"
